syntax = "proto3";

package musictheory;

service MusicTheoryService {
  rpc AnalyzeRomanNumeral(RomanNumeralRequest) returns (RomanNumeralResponse);
}

message RomanNumeralRequest {
  string roman_numeral = 1;
  // Optional key context (e.g. "C", "a", "F#"). Defaults to "C" if empty.
  string key = 2;
}

message RomanNumeralResponse {
  // Echo back what was requested
  string input_roman_numeral = 1;
  string key = 2;

  // Inversion info
  string inversion_text = 3; // e.g. "First Inversion"
  int32 inversion_number = 4; // e.g. 1

  // Common name
  string common_name = 5; // e.g. "major triad"

  // Figured bass numbers, e.g. [6, 3]
  repeated int32 figured_bass_numbers = 6;
  string figured_bass_string = 7; // e.g. "6,3"

  // Pitch information
  repeated string pitch_names = 8; // e.g. ["G", "B", "D"]
  string bass_pitch = 9; // e.g. "B"
  string root_pitch = 10; // e.g. "G"

  // Interval / quality info
  string quality = 11; // e.g. "major"
  bool is_major_triad = 12;
  bool is_minor_triad = 13;
  bool is_dominant_seventh = 14;
  bool is_diminished_seventh = 15;
  bool is_augmented_sixth = 16;

  // Scale degree
  int32 scale_degree = 17; // e.g. 5 for "V"
  string scale_degree_name = 18; // e.g. "Dominant"

  // Chord as a pitch-class set (normal order), e.g. [7, 11, 2]
  repeated int32 pitch_classes = 19;

  // Forte class name if available, e.g. "3-11B"
  string forte_class = 20;

  // LilyPond-formatted chord string, e.g. "< c' e' g' >"
  string lilypond_chord = 21;

  // LilyPond-formatted key string, e.g. "\key c \major"
  string lilypond_key = 22;

  // Intervals from bass note, e.g. ["M3", "P5"]
  repeated string intervals_from_bass = 23;

  // Pitched common name, e.g. "G-major triad"
  string pitched_common_name = 24;

  // Set-theory prime form, e.g. [0, 3, 7]
  repeated int32 prime_form = 25;

  // Interval vector (6-element), e.g. [0, 0, 1, 1, 1, 0]
  repeated int32 interval_vector = 26;

  // Full figure and key string, e.g. "V in C major"
  string figure_and_key = 27;

  // Functional importance score (1–100)
  int32 functionality_score = 28;

  // Additional chord-type flags
  bool is_neapolitan = 29;
  bool is_half_diminished_seventh = 30;
  bool is_augmented_triad = 31;
  bool is_diminished_triad = 32;
  bool is_consonant = 33;

  // Whether it's strictly a triad or strictly a seventh chord
  bool is_triad = 34;
  bool is_seventh = 35;

  // Implied quality from the figure notation
  string implied_quality = 36;

  // Semitones from root for each chord step, e.g. [0, 4, 7]
  repeated int32 semitones_from_root = 37;

  // The chord's third, fifth, seventh pitch names (if present)
  string third_pitch = 38;
  string fifth_pitch = 39;
  string seventh_pitch = 40;
}
